# ===== Nginx 反向代理配置（参考） =====
# Nginx 作用：对外暴露 80/443 端口，把请求转发给内部的 Node.js（3000 端口）
# 同时处理静态文件缓存、gzip 压缩等
#
# 使用方法：
# 1. 复制此文件到 /etc/nginx/sites-available/digital-collection
# 2. 修改 server_name 为你的域名
# 3. ln -s /etc/nginx/sites-available/digital-collection /etc/nginx/sites-enabled/
# 4. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name example.com;  # TODO: 替换为实际域名

    # 所有请求转发给 Next.js（3000 端口）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 静态资源（JS/CSS/图片等）设置长期缓存
    # Next.js 的静态文件名带 hash，可以放心缓存
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }
}
